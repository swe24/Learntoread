name: Deploy to GitHub Pages

# The github-pages environment only allows deployments from the repository's
# default branch. Until 'main' is made the default branch (Settings ->
# General -> Default branch), deploys must run from the current default.
# After switching the default to 'main', change the branch below to 'main'.
on:
  push:
    branches: [claude/ipad-reading-game-kids-2frun3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
